name = "portfolio-agent"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]  # required to bundle @anthropic-ai/sdk

[ai]
binding = "AI"

# Claude concierge/auditor. Set the key with:  wrangler secret put ANTHROPIC_API_KEY
[vars]
# Route Claude through the Cloudflare AI Gateway (rate limiting, caching, observability).
ANTHROPIC_BASE_URL = "https://gateway.ai.cloudflare.com/v1/04bf3d7c95516d3e9a2af68fc8f6619b/jw3b-portfolio-agent/anthropic"
# Optional model override (defaults to claude-opus-4-8):
# ANTHROPIC_MODEL = "claude-sonnet-4-6"
# CTF: the deployed ReentrantVault + the RPC used to verify captures (public, non-secret).
CTF_VAULT_ADDRESS = "0x4f72efbe94677E9bd5a3a1741b137e9Ea203C240"
CTF_RPC_URL = "https://sepolia.base.org"

[observability]
enabled = true

# 📊 D1 ANALYTICS DATABASE (Phase 9 Big & Fancy)
[[d1_databases]]
binding = "DB"
database_name = "jw3b_analytics"
database_id = "7ed65107-5531-4f6b-a0b8-ac9c30ec8fb4"
