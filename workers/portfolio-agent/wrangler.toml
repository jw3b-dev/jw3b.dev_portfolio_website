name = "portfolio-agent"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]  # required to bundle @anthropic-ai/sdk

[ai]
binding = "AI"

# Claude concierge/auditor. Set the key with:  wrangler secret put ANTHROPIC_API_KEY
# Optional model override (defaults to claude-opus-4-8):
# [vars]
# ANTHROPIC_MODEL = "claude-haiku-4-5"

[observability]
enabled = true

# 📊 D1 ANALYTICS DATABASE (Phase 9 Big & Fancy)
[[d1_databases]]
binding = "DB"
database_name = "jw3b_analytics"
database_id = "7ed65107-5531-4f6b-a0b8-ac9c30ec8fb4"
