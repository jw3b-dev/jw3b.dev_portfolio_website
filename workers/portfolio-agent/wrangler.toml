# jw3b.dev v2 — portfolio-agent Worker  ·  backend-specialist (MAS P0-05/06)
# DEPLOY IS OWNER-GATED (John). Real D1/KV/R2 ids + ANTHROPIC_API_KEY secret are provisioned
# by the owner; the placeholders below let `wrangler d1 migrations apply --local` + `wrangler dev` run.
name = "portfolio-agent" # the ONLY target — the `-v2` preview instance was retired 2026-08-21
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI — chat/audit inference, Whisper STT (ADR-05)
[ai]
binding = "AI"

# D1 — analytics, leaderboard, engagements, rate limits, escrow index (§4)
[[d1_databases]]
binding = "DB"
database_name = "jw3b_analytics"
database_id = "7ed65107-5531-4f6b-a0b8-ac9c30ec8fb4"
# INHERITED FROM v1 (this database was created 2026-03-15, before v2 existed) and reconciled to the
# v2 schema by migrations 0003/0004. The comment that used to live here said the v2 migration was
# "idempotent (CREATE TABLE IF NOT EXISTS)" — that was the bug. Against a table that ALREADY EXISTS,
# `CREATE TABLE IF NOT EXISTS` is a no-op, not an upgrade, so a migration can report ✅ applied while
# changing nothing. It cost five days of chat transcripts (`messages`) and every CTF solve record
# (`ctf_solves`), both swallowed by best-effort catches.
# Adding a column to an existing table needs its own ALTER migration. Verify the live database with
# `npm run schema:check` — it diffs production against these migration files.
migrations_dir = "migrations"

# KV — Tier-1 recorded-run transcripts (ADR-01). Re-seedable from the repo — see
# docs/RUNBOOK.md §2 (`wrangler kv key put --binding=KV "run:<key>" …`). Tier-2 bundled
# runs are the always-available floor, so KV loss is non-fatal (DR: RUNBOOK §3).
[[kv_namespaces]]
binding = "KV"
id = "d13bd6d5e09241cba4962521d02cd6ae" # jw3b-recorded-runs (Tier-1 recorded-run/replay store)

# R2 — recorded-run media (audio/video) (ADR-01). Re-seed: RUNBOOK §2
# (`wrangler r2 object put jw3b-recorded-runs/<mediaKey> --file …`).
[[r2_buckets]]
binding = "R2"
bucket_name = "jw3b-recorded-runs"

[vars]
CF_ACCOUNT_ID = "04bf3d7c95516d3e9a2af68fc8f6619b" # reused from the prior deploy; builds the Anthropic-via-AI-Gateway
                                              # URL for the Haiku concierge (ADR-05). Not a secret, but
                                              # the ANTHROPIC_API_KEY it authenticates with IS (below).
AI_GATEWAY = "jw3b-portfolio-agent"           # Cloudflare AI Gateway slug (ADR-05 cost choke).
                                              # Per-model rate/spend CEILING is set gateway-side in the
                                              # AI Gateway dashboard (owner) — the outer limit above the
                                              # per-IP D1 rate-limit in rateLimit.js (P1-01 defense-in-depth).
ALLOWED_ORIGINS = "https://jw3b.dev,https://www.jw3b.dev,https://jw3b-dev-site.agilegypsy.workers.dev" # CORS allowlist (NFR-04); dev origin gated by DEV_ORIGIN secret
CTF_VAULT_ADDRESS = "0x4f72efbe94677E9bd5a3a1741b137e9Ea203C240" # Base Sepolia ReentrantVault (live, matches src/config/contracts.js)
CTF_RPC_URL = "https://sepolia.base.org"        # public Base Sepolia RPC (no key); override with a dedicated endpoint if rate-limited

# Secrets (NEVER in this file — set via `wrangler secret put`):
#   ANTHROPIC_API_KEY   — Anthropic via AI Gateway (ADR-05)
#   DEV_ORIGIN          — optional localhost origin allowed in dev only (absent in prod)
#   NEON_DATABASE_URL   — Postgres/pgvector connection string for the /audit edge-RAG KB
#                         (the ~9.5k-finding corpus reused from KTHULHU). Set via:
#                           wrangler secret put NEON_DATABASE_URL
#                         Absent → the /audit narrative runs without RAG (degrades cleanly).
#   TELEGRAM_BOT_TOKEN  — Bot API token used to alert John the moment a lead lands (W1, notify.js)
#   TELEGRAM_CHAT_ID    — the chat that receives those alerts (John's DM with the bot)
#                         Set BOTH or neither — a half-configured channel counts as absent:
#                           wrangler secret put TELEGRAM_BOT_TOKEN --name portfolio-agent
#                           wrangler secret put TELEGRAM_CHAT_ID   --name portfolio-agent
#                         Absent → leads are still validated, persisted and acknowledged, and the
#                         response carries `alerting:false` so the UI stops promising a follow-up
#                         that nothing would deliver. This pair is the fix for the defect where a
#                         COMPLETED hire request reached nobody: engagement_requests held 0 rows
#                         in production while the success screen said "John will follow up".

# /audit edge-RAG (P2-14 · OD-06): retrieval hits the Neon pgvector KB over NEON_DATABASE_URL
# (see auditRag.js), NOT a Cloudflare Vectorize index — the corpus already exists on Neon, so
# there is nothing to stand up here. The query embeds with bge-m3 (1024-dim) to match the
# corpus. Concierge KB is untouched (curated cleared-claims grounding, P1-03).

# Weekly funnel digest — Mondays 08:00 UTC. The counters exist to make the next prioritisation
# evidence-based; a table nobody reads cannot do that, so the summary is pushed to the rail that
# already reaches John. A quiet week sends nothing rather than a "0" that trains him to ignore it.
[triggers]
crons = ["0 8 * * 1"]
