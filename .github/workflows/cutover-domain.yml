name: Cutover Domain to Worker (one-shot)

# Moves jw3b.dev + www.jw3b.dev from the Pages project to the jw3b-dev-site
# Worker (Workers Static Assets). Detach-from-Pages then attach-to-Worker; if the
# Worker attach fails (e.g. missing scope), it re-attaches to Pages so the site is
# never left without a host.
on:
  push:
    branches: [v2-upgrade]
    paths: ['.github/workflows/cutover-domain.yml']
  workflow_dispatch: {}

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Move custom domains Pages -> Worker (with rollback)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          CF=https://api.cloudflare.com/client/v4
          PAGES="$CF/accounts/$A/pages/projects/jw3b-dev-portfolio/domains"
          ZONE=$(curl -s -H "Authorization: Bearer $T" "$CF/zones?name=jw3b.dev" | jq -r '.result[0].id')
          echo "zone=$ZONE"
          DOMAINS="jw3b.dev www.jw3b.dev"

          for d in $DOMAINS; do
            echo "=== detach $d from Pages ==="
            curl -s -X DELETE -H "Authorization: Bearer $T" "$PAGES/$d" | jq -c '{success, errors}'
          done

          fail=0
          for d in $DOMAINS; do
            echo "=== attach $d -> Worker jw3b-dev-site ==="
            resp=$(curl -s -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              -d "{\"environment\":\"production\",\"hostname\":\"$d\",\"service\":\"jw3b-dev-site\",\"zone_id\":\"$ZONE\"}" \
              "$CF/accounts/$A/workers/domains")
            echo "$resp" | jq -c '{success, errors, hostname: .result.hostname}'
            echo "$resp" | jq -e '.success == true' >/dev/null || fail=1
          done

          if [ "$fail" = "1" ]; then
            echo "!!! Worker attach failed — ROLLING BACK to Pages !!!"
            for d in $DOMAINS; do
              curl -s -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
                -d "{\"name\":\"$d\"}" "$PAGES" | jq -c '{rollback: .success, name: .result.name}'
            done
            echo "Rolled back. Domains are back on Pages; investigate token scope for Workers custom domains."
            exit 1
          fi

          echo "Cutover done — jw3b.dev + www now served by the jw3b-dev-site Worker. Give edge/cert ~1-2 min."
