name: Fix Pages Wiring (one-shot)

# Ops utility: the jw3b-dev-portfolio Pages project has a Git integration that
# was pulling KOINTEL's repo, auto-deploying Kointel builds into jw3b.dev's
# production (404). This disables git-driven auto-deploys on the project so only
# the direct-upload deploy (deploy-frontend job) publishes it. Reversible.
# Run manually: gh workflow run "Fix Pages Wiring (one-shot)" --ref v2-upgrade

on:
  workflow_dispatch: {}
  push:
    branches: [v2-upgrade]
    paths: ['.github/workflows/fix-pages-wiring.yml']  # only when THIS file changes

jobs:
  fix:
    name: Disable git auto-deploys on jw3b-dev-portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and disable git-driven deployments
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/jw3b-dev-portfolio"

          echo "=== BEFORE ==="
          cur=$(curl -s -H "Authorization: Bearer $T" "$API")
          echo "$cur" | jq '{
            success,
            source_type: .result.source.type,
            connected_repo: ((.result.source.config.owner // "?") + "/" + (.result.source.config.repo_name // "?")),
            production_branch: .result.production_branch,
            deployments_enabled: .result.source.config.deployments_enabled,
            production_deployments_enabled: .result.source.config.production_deployments_enabled,
            preview_deployment_setting: .result.source.config.preview_deployment_setting
          }'

          if [ "$(echo "$cur" | jq -r '.result.source // "null"')" = "null" ]; then
            echo "No git source on the project — nothing to disable (already clean)."; exit 0
          fi

          # Preserve the whole source object, only flip the auto-deploy switches off.
          body=$(echo "$cur" | jq -c '{source: (.result.source
                    | .config.deployments_enabled = false
                    | .config.production_deployments_enabled = false
                    | .config.preview_deployment_setting = "none")}')

          echo "=== PATCH ==="
          resp=$(curl -s -X PATCH -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "$body" "$API")
          echo "$resp" | jq '{success, errors,
            deployments_enabled: .result.source.config.deployments_enabled,
            production_deployments_enabled: .result.source.config.production_deployments_enabled,
            preview_deployment_setting: .result.source.config.preview_deployment_setting}'

          echo "$resp" | jq -e '.success == true and .result.source.config.production_deployments_enabled == false' >/dev/null \
            && echo "OK — git auto-deploys disabled; Kointel can no longer publish to jw3b.dev. Your CI direct-upload deploy is unaffected." \
            || { echo "FAILED — the API did not disable it (likely dashboard-only). See errors above."; exit 1; }
