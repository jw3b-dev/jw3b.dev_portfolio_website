# jw3b.dev v2 — CI (P0-12, security/devops gate)  ·  SDD 03 §8 / 05 §6
# Gate jobs:
#   verify    — frontend/worker: lint → coverage → claims-gate → build → secret-leak scan.
#   contracts — Foundry: forge fmt --check → forge test (unit + fuzz + invariant).
# Preview deploy (push to v2 only, gated on verify):
#   deploy-preview-backend  → wrangler deploy --name portfolio-agent-v2  (isolated test worker)
#   deploy-preview-frontend → wrangler deploy --name jw3b-dev-site-v2     (isolated test SPA)
# PRODUCTION (portfolio-agent / jw3b-dev-site on jw3b.dev) is NEVER touched by CI — the owner
# deploys prod manually (docs/RUNBOOK.md). Reuses the existing GH CLOUDFLARE_API_TOKEN/ACCOUNT_ID.
# ADR-09: the claims-gate BLOCKS any uncleared/forbidden claim in CI.
name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc sets legacy-peer-deps=true (React 19 peer graph) — npm ci inherits it.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test + coverage gate
        run: npm run test:coverage

      - name: Claims gate (blocks uncleared/forbidden claims — ADR-09)
        run: npm run claims-gate

      - name: Build
        run: npm run build

      # Runs AFTER build so it scans the actual shipped bundle (dist/) as well as src/.
      - name: Client-bundle secret-leak scan (FR-050)
        run: npm run secret-scan

  # On-chain gate — the Foundry contracts (MilestoneEscrow now; CTF ReentrantVault/Attacker
  # as P2 lands) must stay green too, or a contract regression ships unnoticed. `contracts/lib`
  # is gitignored (reproducible deps), so CI fetches them pinned before testing.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Fetch contract deps (contracts/lib is gitignored)
        working-directory: contracts
        run: |
          git clone --depth 1 --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Format check
        working-directory: contracts
        run: forge fmt --check

      - name: Test (unit + fuzz + invariant)
        working-directory: contracts
        run: forge test -vv

  # ── PREVIEW deploy (push to v2 only) — isolated -v2 instances, production untouched ──────────
  # Reuses the existing wrangler configs (only the worker NAME is overridden via --name) and the
  # existing GH secrets. One-time owner step before the first preview works: set the preview
  # worker's runtime secrets —
  #   wrangler secret put ANTHROPIC_API_KEY --name portfolio-agent-v2
  #   wrangler secret put NEON_DATABASE_URL --name portfolio-agent-v2
  # (worker secrets are per-worker; they persist across preview redeploys). PRODUCTION deploys
  # stay owner-manual (docs/RUNBOOK.md).
  deploy-preview-backend:
    name: Preview — Worker (portfolio-agent-v2)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The worker bundles @anthropic-ai/sdk + @neondatabase/serverless, so install its deps
      # before wrangler bundles the script.
      - name: Install worker deps
        run: npm ci
        working-directory: workers/portfolio-agent
      - name: Deploy preview worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/portfolio-agent
          # --config is REQUIRED: wrangler v4 walks up and would otherwise pick the root
          # wrangler.jsonc (the SPA) instead of this worker's wrangler.toml.
          command: deploy --name portfolio-agent-v2 --config wrangler.toml

  deploy-preview-frontend:
    name: Preview — SPA (jw3b-dev-site-v2)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Point the preview SPA at the preview worker (not production). Feature flags + the public
      # WalletConnect id come from the committed .env.production (mode=production).
      - name: Build (→ preview worker)
        run: npm run build
        env:
          VITE_PORTFOLIO_AGENT_URL: https://portfolio-agent-v2.agilegypsy.workers.dev
      - name: Deploy preview SPA
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name jw3b-dev-site-v2 --config wrangler.jsonc

  # PRODUCTION (portfolio-agent / jw3b-dev-site) is deployed by the owner manually
  # (`wrangler deploy`, no --name). Contract deploys are owner-provisioned too.
  # See docs/RUNBOOK.md for the release + DR procedure.
