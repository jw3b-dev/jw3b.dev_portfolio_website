# jw3b.dev v2 — CI (P0-12, security/devops gate)  ·  SDD 03 §8 / 05 §6
# Gate jobs:
#   verify    — frontend/worker: lint → coverage → claims-gate → build → secret-leak scan.
#   contracts — Foundry: forge fmt --check → forge test (unit + fuzz + invariant).
# Deploy (push to v2 only, gated on verify + e2e + contracts):
#   deploy-backend  → wrangler deploy --name portfolio-agent   (PRODUCTION worker)
#   deploy-frontend → wrangler deploy --name jw3b-dev-site     (PRODUCTION SPA, jw3b.dev)
#   smoke           → the E2E suite against what was just deployed
#
# THERE IS EXACTLY ONE DEPLOY TARGET, AND IT IS PRODUCTION. The isolated `-v2` preview instances
# are gone (worker deleted 2026-08-21). Two live URLs meant "is that fixed?" depended on which one
# you had open, and the preview drifted from production in ways nobody tracked — the confusion
# cost more than the isolation was worth.
# ADR-09: the claims-gate BLOCKS any uncleared/forbidden claim in CI.
name: ci

# ONE BRANCH. `main` held v1's history — an unrelated tree with no common ancestor — and CI
# triggered on it, so pushing there ran the v2 pipeline against v1 code. `main`, `v2-upgrade` (59
# superseded commits) and a stale dependabot branch were deleted 2026-08-21, archived first as the
# tags `v1-archive` and `v2-upgrade-archive`. `v2` is the default and the only branch.
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # .npmrc sets legacy-peer-deps=true (React 19 peer graph) — npm ci inherits it.
      - name: Install
        # Retried: runner network blips (ENETUNREACH / ECONNRESET reaching the registry)
        # were turning healthy commits red. A flaky gate trains people to ignore the gate.
        run: npm ci || (sleep 15 && npm ci) || (sleep 45 && npm ci)

      - name: Lint
        run: npm run lint

      - name: Test + coverage gate (core)
        run: npm run test:coverage

      # Gated separately from the core on purpose: averaging Worker files into the src/lib
      # thresholds would silently lower that 100% line. Each scope stands on its own merits.
      - name: Coverage gate (Worker)
        run: npm run coverage:worker

      - name: Claims gate (blocks uncleared/forbidden claims — ADR-09)
        run: npm run claims-gate

      # Product-audit findings 12/13/14 were one defect: a rename that swept the console but not
      # the surfaces describing it. Fixed by hand, with nothing stopping the old names returning.
      - name: Copy gate (permanent naming ban)
        run: npm run copy-gate

      # Root cause 5: no standing role re-asked "what job does the visitor finish?", so depth
      # arrived only when the owner demanded it. The rule was written into CLAUDE.md and then
      # went unenforced — zero of ten briefs carried it and nothing failed.
      - name: Brief gate (product-owner pass)
        run: npm run brief-gate

      # FR-038 ("nothing ships that a user can't reach") was a requirement with no check, and the
      # rule was enforced by whoever noticed. It went unnoticed five times — FuzzTool, TxExplainer,
      # the vuln corpus, the CTF walkthrough, and the KTHULHU corpus endpoints, that last one for a
      # month while the flagship it would have made operable was reported as owner-gated.
      - name: Reachability gate (FR-038 — no unreachable endpoint)
        run: npm run reachability-gate

      - name: Build
        run: npm run build

      # Runs AFTER build so it scans the actual shipped bundle (dist/) as well as src/.
      - name: Client-bundle secret-leak scan (FR-050)
        run: npm run secret-scan

  # On-chain gate — the Foundry contracts (MilestoneEscrow now; CTF ReentrantVault/Attacker
  # as P2 lands) must stay green too, or a contract regression ships unnoticed. `contracts/lib`
  # is gitignored (reproducible deps), so CI fetches them pinned before testing.
  # The layer the suite was missing. 570 vitest tests run in jsdom: no layout engine, no real
  # network, no bundler output — structurally unable to catch a fixed button covering a footer
  # link, a stale chunk served as HTML, or a finished tool mounted on no page. All three shipped.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || (sleep 15 && npm ci) || (sleep 45 && npm ci)
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: E2E (real browser, production build)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install is retried because the foundryup download has been reset mid-transfer on
      # runners, turning healthy commits red. The retry is a real second attempt — NOT
      # continue-on-error alone, which would let the job limp on with no forge and fail
      # confusingly later. If both attempts fail the job still fails, as it must.
      #
      # `version: stable` pins the toolchain to a released artifact. The default (nightly)
      # resolves a fresh build and its attestation on every run, and that attestation download
      # is what returned HTTP 504 on 2026-08-21, reddening a commit whose contracts were fine.
      # A floating toolchain also means this gate can change underneath us with no commit,
      # which is its own bug. The retry now WAITS first: the original two attempts fired
      # seconds apart, landing inside the same outage window, so the retry never had a chance.
      - name: Install Foundry
        id: foundry
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Wait out the upstream blip
        if: steps.foundry.outcome == 'failure'
        run: sleep 30

      # ✎ 2026-08-22: attempt 2 is now ALSO soft, because a real run went red through both of
      # them (run 32473408258, "Install Foundry (retry)"). Two tries 30s apart both land inside
      # the same upstream outage window, so the retry never had a chance — the same reasoning
      # that added the first wait, one attempt short. A third try 90s later is a different
      # window. Attempt 3 is HARD: if the toolchain genuinely cannot be installed the job must
      # still fail, or this stops being a gate.
      - name: Install Foundry (retry)
        id: foundry2
        if: steps.foundry.outcome == 'failure'
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Wait out a longer outage
        if: steps.foundry.outcome == 'failure' && steps.foundry2.outcome == 'failure'
        run: sleep 90

      - name: Install Foundry (final attempt)
        if: steps.foundry.outcome == 'failure' && steps.foundry2.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Fetch contract deps (contracts/lib is gitignored)
        working-directory: contracts
        # git clone against github.com is the same flaky hop — retry once before failing.
        run: |
          clone() { git clone --depth 1 "$@" || (sleep 15 && git clone --depth 1 "$@"); }
          clone --branch v5.6.1 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          clone https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Format check
        working-directory: contracts
        run: forge fmt --check

      - name: Test (unit + fuzz + invariant)
        working-directory: contracts
        run: forge test -vv

  # ── PRODUCTION deploy (push to v2 only) ──────────────────────────────────────────────────────
  # Gated on verify + e2e + contracts, then smoke-tested against the deployed result. The `--name`
  # flags are explicit and match the wrangler configs; there is no other target to point them at.
  deploy-backend:
    name: Deploy — Worker (portfolio-agent)
    runs-on: ubuntu-latest
    needs: [verify, e2e, contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The worker bundles @anthropic-ai/sdk + @neondatabase/serverless, so install its deps
      # before wrangler bundles the script.
      - name: Install worker deps
        # Retried: runner network blips (ENETUNREACH / ECONNRESET reaching the registry)
        # were turning healthy commits red. A flaky gate trains people to ignore the gate.
        run: npm ci || (sleep 15 && npm ci) || (sleep 45 && npm ci)
        working-directory: workers/portfolio-agent
      - name: Deploy the production worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'   # pin >=4 for deterministic deploys (parity with the SPA step; see GAP-01 note)
          workingDirectory: workers/portfolio-agent
          # --config is REQUIRED: wrangler v4 walks up and would otherwise pick the root
          # wrangler.jsonc (the SPA) instead of this worker's wrangler.toml.
          command: deploy --name portfolio-agent --config wrangler.toml

  deploy-frontend:
    name: Deploy — SPA (jw3b.dev)
    runs-on: ubuntu-latest
    needs: [verify, e2e, contracts, deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        # Retried: runner network blips (ENETUNREACH / ECONNRESET reaching the registry)
        # were turning healthy commits red. A flaky gate trains people to ignore the gate.
        run: npm ci || (sleep 15 && npm ci) || (sleep 45 && npm ci)
      # Builds against the PRODUCTION worker (the default in config/worker.js). Feature flags
      # and the public WalletConnect id come from the committed .env.production — no env
      # overrides here, so what CI ships is exactly what the repo says it ships.
      - name: Build
        run: npm run build
      - name: Deploy the production SPA
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # GAP-01 fix: pin wrangler >=4. The wrangler that wrangler-action installs by default
          # silently IGNORES assets.run_worker_first, so worker.js never runs on the shell (/) or
          # hashed /assets/* — the SPA would ship with NO CSP and no immutable-asset caching.
          # wrangler 4.123.0 was verified (local `wrangler dev`) to apply run_worker_first: the
          # worker runs on every path (x-served-by + CSP on /, immutable on /assets/*). Re-verify:
          #   curl -sSI https://jw3b.dev/  -> content-security-policy + x-served-by present
          wranglerVersion: '4.123.0'
          command: deploy --name jw3b-dev-site --config wrangler.jsonc

  # (Historical note: production used to be an owner-manual step behind a preview. Both the manual
  #  step and the preview are gone — this workflow is the only path to the live site.)
  # (`wrangler deploy`, no --name). Contract deploys are owner-provisioned too.
  # See docs/RUNBOOK.md for the release + DR procedure.

  # A green build proves compilation, not behaviour. This drives the REAL site right after it
  # ships, including the live AI surfaces, so a bad deploy is caught in the same run that made
  # it rather than by a visitor.
  smoke:
    name: Post-deploy smoke (live)
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || (sleep 15 && npm ci) || (sleep 45 && npm ci)
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for the deploy to propagate
        run: sleep 20
      # Targets the SPA's *.workers.dev hostname, NOT jw3b.dev — same deployed worker, same
      # code. The apex sits behind the zone's Cloudflare bot protection, which serves datacenter
      # IPs (every GitHub runner) a managed-challenge page instead of the site: the first run of
      # this job proved it by reporting Cloudflare's own CSP rather than ours. The workers.dev
      # origin bypasses the zone layer, so this verifies what we just shipped; the scheduled
      # health check still covers the apex from the edge's point of view.
      - name: E2E against the deployed site
        run: npx playwright test
        env:
          E2E_BASE_URL: https://jw3b-dev-site.agilegypsy.workers.dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: post-deploy-smoke
          path: playwright-report/
          retention-days: 7
