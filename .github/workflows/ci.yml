name: CI & Deploy

on:
  push:
    branches: [main, v2-upgrade]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test (coverage) & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # .npmrc sets legacy-peer-deps=true (required for the React 19 dep graph)
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (with coverage gate)
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

  deploy-backend:
    name: Deploy Worker (backend)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2-upgrade')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The worker bundles @anthropic-ai/sdk + @neondatabase/serverless (RAG),
      # so its deps must be installed before wrangler bundles the script.
      - name: Install worker dependencies
        run: npm ci
        working-directory: workers/portfolio-agent

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/portfolio-agent
          command: deploy
        # Note: worker secrets (ANTHROPIC_API_KEY, NEON_DATABASE_URL) persist across
        # deploys — set once with `wrangler secret put`; `wrangler deploy` never removes them.

  deploy-frontend:
    name: Deploy Frontend (Workers Static Assets)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2-upgrade')
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler v4 needs Node >=22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Migrated off Cloudflare Pages (project deleted after its git integration
      # was hijacked by another repo). The SPA is now a Workers Static Assets
      # site (wrangler.jsonc → jw3b-dev-site), served on jw3b.dev + www.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
