name: Deploy Site Worker

# Workers Static Assets host for the SPA (successor to the Pages project).
# Stage 1: deploys alongside Pages so it can be verified on *.workers.dev before
# the custom domain is flipped over. Serves ./dist with SPA fallback.
on:
  push:
    branches: [v2-upgrade]
    paths:
      - 'wrangler.jsonc'
      - 'worker.js'
      - '.github/workflows/deploy-site-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy-site-worker:
    name: Build + deploy SPA to Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # wrangler v4 (repo dep) needs Node >=22; else action falls back to v3 which can't read the assets+main config
      - run: npm ci
      - run: npm run build
      - name: Deploy to Workers (static assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
