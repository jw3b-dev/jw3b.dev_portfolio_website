# Scheduled production verification (P4-04, extended in P5 · devops-engineer)
#
# Two jobs:
#   probe     — cheap liveness pings; opens/closes ONE GitHub issue on a state change, so a
#               silent outage surfaces as a notification rather than a visitor discovering it.
#               Deliberately hits NO paid AI route.
#   live-e2e  — a real browser against the deployed site, including the concierge and audit
#               streams. This DOES spend a few model calls per run; that is the price of
#               knowing the AI surfaces actually answer in production rather than assuming it,
#               and at a 6-hour cadence it is a handful of calls a day.
name: Health check

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {} # manual "check now" button

# Least privilege: read the repo, write issues (to raise/close the alert).
permissions:
  contents: read
  issues: write

jobs:
  # Live end-to-end against the DEPLOYED site. The build gate runs the deterministic specs;
  # these drive real third-party-backed services (the concierge, the audit stream), so a
  # failure here means "production is degraded right now" rather than "this commit is bad".
  live-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || (sleep 15 && npm ci) || (sleep 45 && npm ci)
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E against production
        run: npm run e2e:prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-e2e-report
          path: playwright-report/
          retention-days: 7

  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ALERT_LABEL: health-alert
    steps:
      - name: Probe live surfaces
        id: probe
        run: |
          set -uo pipefail
          UA='Mozilla/5.0 (compatible; jw3b-healthcheck/1.0; +https://jw3b.dev)'
          # name|url|mode — no AI spend (liveness endpoints only). Modes:
          #   <codes> — comma-separated acceptable HTTP codes (e.g. "200" or "200,403").
          #   alive   — must merely RESPOND: only a timeout/refused (000) or a 5xx is "down".
          #             Workers use this because prod and preview run different code (the prod
          #             worker predates some v2 routes), so a 404/405 still proves it's serving.
          #
          # WHY prod-site accepts 403: jw3b.dev sits behind the zone's Cloudflare bot/WAF layer,
          # which 403s datacenter IPs — including GitHub Actions runners — while real users and
          # verified crawlers get 200 (confirmed 2026-08-21: every UA, incl. Googlebot, returns
          # 200 from a residential IP; the *.workers.dev origin returns 200 from the runner).
          # A 403 therefore proves the edge is up and deciding, not that the site is down; a
          # 404/5xx/timeout still alarms, so a genuine outage or broken route is NOT masked.
          TARGETS=(
            "prod-site|https://jw3b.dev/|200,403"
            "prod-worker|https://portfolio-agent.agilegypsy.workers.dev/|alive"
            "preview-site|https://jw3b-dev-site-v2.agilegypsy.workers.dev/|200"
            "preview-worker|https://portfolio-agent-v2.agilegypsy.workers.dev/ctf/leaderboard|200"
          )
          accepts() { case ",$1," in *",$2,"*) return 0;; *) return 1;; esac; }
          FAILURES=""
          for t in "${TARGETS[@]}"; do
            name="${t%%|*}"; rest="${t#*|}"; url="${rest%|*}"; mode="${rest##*|}"
            code=""
            # 3 attempts with backoff so a single transient blip doesn't false-alarm.
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -A "$UA" -w '%{http_code}' --max-time 20 "$url" || echo "000")
              if [ "$mode" = "alive" ]; then
                { [ "$code" != "000" ] && [ "$code" -lt 500 ]; } && break
              else
                accepts "$mode" "$code" && break
              fi
              sleep $((attempt * 5))
            done
            down=""
            if [ "$mode" = "alive" ]; then
              { [ "$code" = "000" ] || [ "$code" -ge 500 ]; } && down=1
            else
              accepts "$mode" "$code" || down=1
            fi
            if [ -n "$down" ]; then
              echo "DOWN  $name ($url) → HTTP $code"
              FAILURES="${FAILURES}- **${name}** (${url}) → HTTP ${code}"$'\n'
            else
              echo "ok    $name → HTTP $code ($mode)"
            fi
          done
          if [ -n "$FAILURES" ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            { echo "body<<EOF"; echo "Automated health check failed at $(date -u '+%Y-%m-%d %H:%M UTC'):"; echo; printf '%s' "$FAILURES"; echo; echo "_Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}_"; echo EOF; } >> "$GITHUB_OUTPUT"
          else
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure alert label exists
        run: gh label create "$ALERT_LABEL" --repo "$GITHUB_REPOSITORY" --color b60205 --description "Automated health-check alert" 2>/dev/null || true

      - name: Raise or refresh the alert (on failure)
        if: steps.probe.outputs.healthy == 'false'
        env:
          BODY: ${{ steps.probe.outputs.body }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ALERT_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Refreshed alert #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "🔴 Health check failing" --label "$ALERT_LABEL" --body "$BODY"
            echo "Opened new alert"
          fi

      - name: Resolve the alert (on recovery)
        if: steps.probe.outputs.healthy == 'true'
        run: |
          set -euo pipefail
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ALERT_LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "✅ All surfaces healthy again as of $(date -u '+%Y-%m-%d %H:%M UTC') — auto-resolved."
            echo "Closed alert #$n"
          done

      - name: Fail the run when unhealthy (visible red X)
        if: steps.probe.outputs.healthy == 'false'
        run: exit 1
