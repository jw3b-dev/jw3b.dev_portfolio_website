name: Cutover via Worker Routes (one-shot)

# Route jw3b.dev/* and www.jw3b.dev/* to the jw3b-dev-site Worker. Routes
# intercept the existing proxied hostname without deleting DNS (avoids the
# custom-domain 100117 conflict). Zero-downtime and instantly reversible
# (delete the route). Verifies via the x-served-by header afterwards.
on:
  push:
    branches: [v2-upgrade]
    paths: ['.github/workflows/cutover-routes.yml']
  workflow_dispatch: {}

jobs:
  routes:
    runs-on: ubuntu-latest
    steps:
      - name: Add Worker routes for the apex + www
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          CF=https://api.cloudflare.com/client/v4
          ZONE=$(curl -s -H "Authorization: Bearer $T" "$CF/zones?name=jw3b.dev" | jq -r '.result[0].id')
          echo "zone=$ZONE"
          for p in "jw3b.dev/*" "www.jw3b.dev/*"; do
            echo "=== add route $p -> jw3b-dev-site ==="
            curl -s -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              -d "{\"pattern\":\"$p\",\"script\":\"jw3b-dev-site\"}" \
              "$CF/zones/$ZONE/workers/routes" | jq -c '{success, errors, pattern: .result.pattern}'
          done
          echo "Routes added (if success). Verify: curl -sI https://jw3b.dev | grep x-served-by"
